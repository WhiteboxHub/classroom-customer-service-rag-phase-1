global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rag_backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s

  - job_name: 'prometheus_self'
    static_configs:
      - targets: ['localhost:9090']
