version: '3.8'

services:
  # API Gateway (Nginx)
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - open-webui

  # Open WebUI (Frontend)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - OPENAI_API_BASE_URL=http://gateway:80/api/v1
      - OPENAI_API_KEY=sk-dummy
    volumes:
      - ./open-webui/config.json:/app/backend/config.json
      - open-webui-data:/app/backend/data
    depends_on:
      - backend

  # Backend (FastAPI + Celery)
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file: .env
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./backend:/app

  # Postgres (Relational Data)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_data/postgres:/docker-entrypoint-initdb.d

  # Redis (Celery Broker & Cache)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # Neo4j Community Edition (Graph + Vector DB — replaces Milvus)
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      NEO4J_AUTH: neo4j/password
      # Enable vector index plugin (GDS not needed for Community vector index)
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  open-webui-data:
  postgres-data:
  neo4j-data:
  neo4j-logs:
