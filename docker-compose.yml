version: "3.8"

services:
  # ============================
  # Open-WebUI (UI + its backend)
  # ============================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      # Point Open-WebUI directly to FastAPI (OpenAI-compatible)
      - OPENAI_API_BASE_URL=http://backend:8000/v1
      - OPENAI_API_BASE_URL=http://backend:8000
      - OPENAI_API_KEY=sk-dummy
      - WEBUI_AUTH=true
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - backend

  # ============================
  # Backend (FastAPI RAG API)
  # ============================
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  # ============================
  # Postgres
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_data/postgres:/docker-entrypoint-initdb.d

  # ============================
  # Redis
  # ============================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  open-webui-data:
  postgres-data:
